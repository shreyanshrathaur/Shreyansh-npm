<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shapewatch Interactive Demo</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; background: #0f172a; color: #f8fafc; }
    h1 { color: #38bdf8; }
    .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #334155; }
    button { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; margin-right: 10px; }
    button.break { background: #ef4444; }
    button:hover { opacity: 0.9; }
    pre { background: #090d16; padding: 12px; border-radius: 6px; overflow-x: auto; color: #a5f3fc; }
    .status { font-weight: bold; margin-bottom: 12px; }
    .broken { color: #f87171; }
    .normal { color: #4ade80; }
  </style>
</head>
<body>
  <h1>Shapewatch Demo</h1>
  <div class="card">
    <div id="backendStatus" class="status normal">Backend Status: Normal</div>
    <button id="fetchBtn">Send Fetch Request</button>
    <button id="breakBtn" class="break">Break the Backend</button>
    <button id="resetBtn">Reset Baseline</button>
  </div>

  <div class="card">
    <h3>Latest Response:</h3>
    <pre id="responseBox">// Click "Send Fetch Request" to begin</pre>
  </div>

  <div class="card">
    <h3>Detected Shape Drifts:</h3>
    <pre id="driftBox">No drifts recorded yet.</pre>
  </div>

  <script type="module">
    let sampleCount = 0;
    const learnedBaseline = {
      'id': 'number',
      'name': 'string',
      'email': 'string',
      'active': 'boolean',
      'score': 'number'
    };

    const statusEl = document.getElementById('backendStatus');
    const responseBox = document.getElementById('responseBox');
    const driftBox = document.getElementById('driftBox');

    async function checkStatus() {
      const res = await fetch('/api/status');
      const data = await res.json();
      if (data.isBroken) {
        statusEl.textContent = 'Backend Status: BROKEN (Drift Active)';
        statusEl.className = 'status broken';
      } else {
        statusEl.textContent = 'Backend Status: Normal';
        statusEl.className = 'status normal';
      }
    }

    document.getElementById('fetchBtn').addEventListener('click', async () => {
      sampleCount++;
      const res = await fetch(`/api/users/${sampleCount}`);
      const data = await res.json();
      responseBox.textContent = JSON.stringify(data, null, 2);

      const drifts = [];
      if (!('name' in data)) drifts.push({ kind: 'FIELD_REMOVED', severity: 'breaking', path: '$.name' });
      if (typeof data.score !== 'number') drifts.push({ kind: 'TYPE_CHANGED', severity: 'breaking', path: '$.score', actual: typeof data.score });
      if (data.email === null) drifts.push({ kind: 'UNEXPECTED_NULL', severity: 'warning', path: '$.email' });
      if ('unexpectedField' in data) drifts.push({ kind: 'FIELD_ADDED', severity: 'info', path: '$.unexpectedField' });

      if (drifts.length > 0) {
        driftBox.textContent = JSON.stringify(drifts, null, 2);
      } else {
        driftBox.textContent = `Sample ${sampleCount} received: Shape matches baseline perfectly.`;
      }
    });

    document.getElementById('breakBtn').addEventListener('click', async () => {
      await fetch('/api/toggle-break');
      await checkStatus();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      sampleCount = 0;
      driftBox.textContent = 'Baseline reset.';
      responseBox.textContent = '// Reset complete';
    });

    checkStatus();
  </script>
</body>
</html>
